# Shared locations for the HTTP and SSL servers.
# __WEBAPI_UPSTREAM__ is replaced by the entrypoint (default http://webapi:8080).

root  /opt/metasfresh-webui-frontend/dist;
index index.html;

proxy_buffering    off;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $forwarded_proto;
proxy_buffers      256 16k;
proxy_buffer_size  16k;
proxy_read_timeout 600s;
client_max_body_size 100M;

# webapi
location /rest          { proxy_pass __WEBAPI_UPSTREAM__; }
location /info          { proxy_pass __WEBAPI_UPSTREAM__; }
location /configuration { proxy_pass __WEBAPI_UPSTREAM__; }
location /oauth2        { proxy_pass __WEBAPI_UPSTREAM__; }
location /login/oauth2  { proxy_pass __WEBAPI_UPSTREAM__; }
location /swagger-ui.html            { proxy_pass __WEBAPI_UPSTREAM__; }
location /swagger-ui/                { proxy_pass __WEBAPI_UPSTREAM__; }
location /swagger-resources          { proxy_pass __WEBAPI_UPSTREAM__; }
location /v2/api-docs                { proxy_pass __WEBAPI_UPSTREAM__; }
location /v3/api-docs                { proxy_pass __WEBAPI_UPSTREAM__; }
location /webjars/springfox-swagger-ui { proxy_pass __WEBAPI_UPSTREAM__; }

location /stomp {
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    client_max_body_size 50M;
    proxy_pass __WEBAPI_UPSTREAM__;
}

# app
location = /app { return 308 /app/; }
location /app/ {
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    client_max_body_size 50M;
    proxy_pass http://app:8282/;
}

# static + SPA + mobile
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma        "no-cache";
    expires -1;
}
location = /service-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma        "no-cache";
    expires -1;
}
location /mobile/ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma        "no-cache";
    expires -1;
    try_files $uri /mobile/index.html;
}
location / {
    try_files $uri /index.html;
}
